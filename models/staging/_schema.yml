version: 2

models:
  - name: dim_product
    description: >
      Product dimension table containing SKU-level product attributes,
      pricing, aggregated supply cost, and perishability information.

    columns:
      - name: product_sku
        description: Unique identifier for each product SKU.
        tests:
          - unique
          - not_null

  - name: fct_sales_line
    description: >
      Final sales fact table at the sold item grain.
      Each row represents one sold item enriched with
      order, product, store, and profitability information.

    columns:
      - name: item_id
        description: Unique identifier for each sold item transaction.
        tests:
          - unique
          - not_null

      - name: order_id
        description: Identifier for the order associated with the item.
        tests:
          - not_null

      - name: product_sku
        description: SKU identifier for the sold product.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_sku

  - name: mart_product_performance
    description: >
      Aggregated product-level performance mart used for
      analyzing revenue, profitability, and product portfolio strategy.

    columns:
      - name: product_sku
        description: SKU identifier for each product.
        tests:
          - unique
          - not_null

      - name: total_revenue
        description: Total revenue generated by the product.
        tests:
          - not_null

      - name: profit_margin_rate
        description: Ratio of total profit to total revenue for the product.
        tests:
          - not_null